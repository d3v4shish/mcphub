[project]
name = "firewall-mcp-agent"
version = "1.0.0"
description = "Local, authenticated firewall analytics agent backed by standard MCP."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.9,<2",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
firewall-central = "firewall_agent.central:run"
firewall-mcp = "firewall_agent.mcp_server:run"
asset-mcp = "firewall_agent.extra_mcp:run_asset"
threat-mcp = "firewall_agent.extra_mcp:run_threat"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firewall_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
